# Pushing a v* tag zips the tool as "FH2 Mods\..." and publishes it as a GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir "FH2 Mods"
          cp "FH2 Mods.bat" "FH2 Mods.ps1" README.txt apply.ps1 car_power.py cars.json settings.json Diagnose.bat diagnose.ps1 "FH2 Mods/"
          cp LICENSE "FH2 Mods/LICENSE.txt"
          cp -r ExtraOptions "FH2 Mods/"
          zip -r "FH2-Cars-GamePlay-Mods-${GITHUB_REF_NAME}.zip" "FH2 Mods"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "FH2-Cars-GamePlay-Mods-${GITHUB_REF_NAME}.zip" --title "FH2 Cars & Gameplay Mods ${GITHUB_REF_NAME}" --notes "Extract the zip and put the **FH2 Mods** folder next to azimuth.exe. Requires Python 3 on PATH and **Azimuth 0.9.10**. See the README for setup and keyboard shortcuts.

          **What's new**
          - **Fixed Apply changing the wrong game** when Azimuth also lists FH2 Presents Fast & Furious (Spire): the tool now only uses Forza Horizon 2 (Anthem), and refuses a backup_original that was made from another game.
          - **Fixed the Skill Legend perk (x6) capping the skill chain at x6** when Highest chain multiplier is set higher: with the perk it now goes one above your setting.
          - **Car mods work when a car mod moved the game database** into mediaoverride (they failed with \"game not found\").
          - **New: Random car in game:** in My Cars, click the right stick (or press R) to jump to a random car of your garage. The FH2 Mods window also has a Random car from my garage button.
          - **Rev limit now goes up to x2**: higher values crashed the game (cars already set higher are applied at x2).
          - Diagnose lists every game folder in azimuth.ini and which game it is."
