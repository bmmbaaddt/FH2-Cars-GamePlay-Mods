# Pushing a v* tag zips the tool as "FH2 Mods\..." and publishes it as a GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir "FH2 Mods"
          cp "FH2 Mods.exe" README.txt apply.ps1 car_power.py cars.json settings.json Diagnose.bat diagnose.ps1 "FH2 Mods/"
          cp LICENSE "FH2 Mods/LICENSE.txt"
          cp -r ExtraOptions "FH2 Mods/"
          zip -r "FH2-Cars-GamePlay-Mods-${GITHUB_REF_NAME}.zip" "FH2 Mods"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "FH2-Cars-GamePlay-Mods-${GITHUB_REF_NAME}.zip" --title "FH2 Cars & Gameplay Mods ${GITHUB_REF_NAME}" --notes "Extract the zip and put the **FH2 Mods** folder next to azimuth.exe, then double-click **FH2 Mods.exe**. Requires Python 3 on PATH and **Azimuth 1.0.4**. See the README for setup and keyboard shortcuts.

          **What's new in 2.0.1**
          - **Fixed:** Apply failed with "pattern not found in AI/CarLoadingSettings.xml: MaxActiveTraffic" when another traffic mod had changed that file before FH2 Mods made its backup. The traffic cap is now scaled from whatever value the file has. Update and press Apply.

          **What's new in 2.0**
          - **One app: FH2 Mods.exe.** The settings window (FH2 Mods.bat) is gone. With the game closed the menu opens on the new **Setup** tab (everything the window had, plus Apply, Apply & Play, Play and Restore originals) and the **Cars** tab; it then stays in the tray and is the overlay in game (Insert). Updating: extract over 1.x; settings.json, cars.json and overlay.ini carry over, and the old FH2 Mods.bat, FH2 Mods.ps1 and FH2 Mods Overlay.exe are removed when FH2 Mods.exe first starts.
          - **Cars tab:** search for a car or press *The car I'm in*. New **Rev ceiling** (rev limit past 10,500 rpm for one car, up to 20,000; at your own risk). **Export / Import tune** to share a car's setup.
          - **New packs:** ultra grip tires (a new tire upgrade for every car, extra grip over race slicks), Race+ weight reduction (up to 60% lighter), AWD and RWD conversions for the cars without them, turbos for the 16 engines with no turbo option, free upgrades (1 CR).
          - **Engine swaps:** every engine has a name (134 had none), the list is sorted by size, and a fitted swap always stays the same engine.
          - **Camera FOV** for the hood, bumper, near chase and far chase cameras.
          - **New gauges:** G-force meter and power graph (torque and power curves with your rpm). **Telemetry recording** to CSV.
          - **Fixed:** the game hung after fast travel with *Traffic and AI cars for sale* on.
          - **Diagnose** also checks your garage against the game database, lists your settings and shows the last crashes.

          **What's new in 1.4**
          - **Azimuth 1.0.4 and ExtraOptions 0.4.4.** Update Azimuth from itch.io first (your saves carry over), then press Apply. 1.0.1 to 1.0.3 work too.
          - The included ExtraOptions is now 0.4.4 with this tool's additions (ghost cars, Ctrl world keys, random car, sky road). New from ExtraOptions: time and weather controls in the pause menu (Y), a time slider in photo mode, headlights that light the road in daytime, a vignette toggle, garage revving in the outposts too. Apply installs its two plugin mods (garage revving, time and weather control) in the mods folder.
          - **Overlay: steering lock** (Driving tab, Handling): how far the front wheels turn, 20-90° (most cars: 42° stock). It still narrows at speed.
          - **Overlay: gas / brake graph** (Gauges tab): the last 5 seconds of throttle and brake, like Assetto Corsa's input telemetry. Movable like the other gauges.

          **What's new in 1.3**
          - **Azimuth 1.0.2 and ExtraOptions 0.3.2.** Update Azimuth from itch.io first (your saves carry over), then press Apply. On an older Azimuth everything works except ghost cars, ExtraOptions' keys, world keys and sky road.
          - The included ExtraOptions is now 0.3.2 with this tool's additions (ghost cars, Ctrl world keys, random car, sky road). New from 0.3: the mods folder loader, Jump to Manufacturer, all online races offline, custom showcases, F1 to hide the HUD, photo mode from the garage, more audio and HUD options.
          - **Keys are now in the [Bindings] section of FH2_ExtraOptions.ini.** Your old L / Q / E / H keys are moved over. Indicators need a short hold (0.5 s). J is Autodrive, K the roof, F1 hides the HUD. ExtraOptions' default F2 / F3 / F4 keys are moved off the overlay's keys.
          - Apply now rebuilds FH2_ExtraOptions.ini from the new template and keeps your values, so an old ini no longer makes ExtraOptions refuse to start.

          **What's new in 1.2**
          - **Game modes in the overlay**: press F2 while driving (or use the new Modes tab) to switch between off, speed bomb, score attack and pursuit. Best results are saved.
            - **Speed bomb**: reach 50 mph to arm it, then never drop below it, or the car blows up. It gets 5 mph faster every minute.
            - **Score attack**: 2 minutes of points for speed, drifts, air time and near misses. New skills raise the multiplier up to x5; a crash loses the chain.
            - **Pursuit**: drivatars are dropped behind you and chase you along the roads you drove. Stop next to one for 2.5 s and you are busted; 3 hits and you are wrecked; stay 250 m away for 8 s to escape, then they come back faster and more of them. Ghosting is off during a pursuit.
          - **The game modes are new and may be buggy, pursuit most of all** (chasers can float or sink a little off your route; Chaser height on the Modes tab trims it). Press End to stop a mode.
          - **Fixed: swapping a car pack's gamedbRC.slt** for another pack's and back mixed the two databases. Each pack's database is now taken as its own, and the car mods result warns when your garage has cars the pack does not have.
          - **Fixed: Apply failed with Access to the path is denied** when FH2_ExtraOptions.ini (or another file it rewrites) was read-only or hidden.
          - **Fixed: indicator and other ExtraOptions keys went back to Q / E / L / H** after Restore originals, or when another mod replaced FH2_ExtraOptions.ini. Your keys are now kept.
          - **Fixed: the window showed only Failed:** with no reason; it now shows the error.
          - Never delete backup_original after an Apply: the next Apply would back up already-modded files. Press Apply again after updating."
