# Pushing a v* tag zips the tool as "FH2 Mods\..." and publishes it as a GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir "FH2 Mods"
          cp "FH2 Mods.bat" "FH2 Mods.ps1" "FH2 Mods Overlay.exe" README.txt apply.ps1 car_power.py cars.json settings.json Diagnose.bat diagnose.ps1 "FH2 Mods/"
          cp LICENSE "FH2 Mods/LICENSE.txt"
          cp -r ExtraOptions "FH2 Mods/"
          zip -r "FH2-Cars-GamePlay-Mods-${GITHUB_REF_NAME}.zip" "FH2 Mods"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "FH2-Cars-GamePlay-Mods-${GITHUB_REF_NAME}.zip" --title "FH2 Cars & Gameplay Mods ${GITHUB_REF_NAME}" --notes "Extract the zip and put the **FH2 Mods** folder next to azimuth.exe. Requires Python 3 on PATH and **Azimuth 0.9.10**. See the README for setup and keyboard shortcuts.

          **What's new in 1.1.1**
          - **Fixed: traffic and AI cars didn't show in the Autoshow** with the pack on. All 17 (hatchbacks, vans, the bus and the box truck) are now for sale, and they still drive around as traffic. Press Apply again after updating.
          - **Rocket on the controller**: click the left stick (LS) to fire the rocket, as well as the 4 key.
          - **Faster UFO mode**: speed up to 1000 mph (1609 km/h) and climb up to 300 mph.
          - The FH2 Mods window and the overlay still work together: set car mods and packs in the window, then change your car live with the overlay.
          - The game must run in windowed or borderless mode for the overlay to show."
