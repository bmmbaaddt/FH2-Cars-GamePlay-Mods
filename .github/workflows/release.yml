# Pushing a v* tag zips the tool as "FH2 Mods\..." and publishes it as a GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          mkdir "FH2 Mods"
          cp "FH2 Mods.bat" "FH2 Mods.ps1" README.txt apply.ps1 car_power.py cars.json settings.json Diagnose.bat diagnose.ps1 "FH2 Mods/"
          cp LICENSE "FH2 Mods/LICENSE.txt"
          cp -r ExtraOptions "FH2 Mods/"
          zip -r "FH2-Cars-GamePlay-Mods-${GITHUB_REF_NAME}.zip" "FH2 Mods"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "FH2-Cars-GamePlay-Mods-${GITHUB_REF_NAME}.zip" --title "FH2 Cars & Gameplay Mods ${GITHUB_REF_NAME}" --notes "Extract the zip and put the **FH2 Mods** folder next to azimuth.exe. Requires Python 3 on PATH and **Azimuth 0.9.10**. See the README for setup and keyboard shortcuts.

          **What's new**
          - **Fixed \"pattern not found in CameraSettings.ini\"** with cockpit FOV mods. Apply now works on top of them: leave Cockpit FOV at 48 to keep the mod's FOV, or set your own.
          - **FM5 Car Importer:** cars it adds after an Apply are kept, car mods are no longer applied twice (which failed with \"UNIQUE constraint failed\"), and Restore originals goes back to stock again.
          - **Fixed** Apply failing with a Test-Path error when data\bin has no azimuth-tls.dll.
          - Diagnose no longer reports another mod's files as the cause unless Apply actually failed on them."
