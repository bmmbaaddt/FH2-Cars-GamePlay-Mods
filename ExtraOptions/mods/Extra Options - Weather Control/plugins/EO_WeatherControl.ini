; EO Weather Control. Startup bindings and in-game settings.
; Disable/remove the original TimeLock.dll before loading this replacement.
[Bindings]
; Default Y. Supported names: Y, X, A, B, View, None.
; Avoid buttons already used by the pause menu. X is Return to garage.
ChangeTimeXbox=Y
; Optional Windows virtual-key number, 0 = unbound. Example: 117 = F6.
; Keyboard input is only read while the pause menu is active and focused.
ChangeTimeKeyboard=0

[TimeLock]
; 0 = normal time progression (default), 1 = lock free-roam time.
Enabled=1
; Decimal hours, HH:MM, or Dawn/Noon/Sunset/Night. UI uses 15-minute steps.
Hour=20.00

[Weather]
; Dynamic, Sunny, Wet, Rain, Storm. Events retain their own controls.
Mode=Dynamic

[Presets]
Dawn=5:45
Noon=12:00
Sunset=17:50
Night=23:00

[Logging]
; Writes plugins/EO_WeatherControl.log only when set to 1.
Enabled=0
